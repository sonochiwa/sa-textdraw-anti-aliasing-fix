name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $iniHeader = Get-Content Config\TextDrawAntiAliasingFix.ini -TotalCount 1
            if ($iniHeader -notmatch '^# TextDraw Anti-Aliasing Fix v(?<version>\d+\.\d+\.\d+)$') {
              throw 'The INI header does not contain a semantic version.'
            }
            $tag = "v$($Matches.version)"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a semantic release tag."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out release revision
        if: github.ref_type != 'tag'
        shell: pwsh
        run: git checkout --force 'refs/tags/${{ steps.release.outputs.tag }}'

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        run: msbuild TextDrawAntiAliasingFix.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m

      - name: Validate tag and prepare archive
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' is not a semantic release tag."
          }
          $version = $Matches.version
          $iniHeader = Get-Content Config\TextDrawAntiAliasingFix.ini -TotalCount 1
          $changelog = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $sectionPattern = "(?ms)^##[ \t]+$escaped(?:[ \t]+-[^\r\n]+)?[ \t]*\r?\n(?<body>.*?)(?=^##[ \t]+|\z)"
          $section = [regex]::Match($changelog, $sectionPattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md has no section for $version."
          }

          if ($iniHeader -ne "# TextDraw Anti-Aliasing Fix v$version") {
            throw "INI version does not match tag $tag."
          }

          $archiveBase = "TextDrawAntiAliasingFix-v$version"
          $staging = "build\release\$archiveBase"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item build\TextDrawAntiAliasingFix.asi $staging
          Copy-Item Config\TextDrawAntiAliasingFix.ini $staging

          $archive = "build\$archiveBase.zip"
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath $staging).FullName `
            -DestinationPath $archive -CompressionLevel Optimal

          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archiveBase.zip" | Set-Content "$archive.sha256" -Encoding ascii
          $section.Groups['body'].Value.Trim() | Set-Content build\release-notes.md -Encoding utf8

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Attest release archive
        if: steps.package.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub Release
        if: steps.package.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.package.outputs.tag }}' `
            '${{ steps.package.outputs.archive }}' `
            '${{ steps.package.outputs.checksum }}' `
            --title 'TextDraw Anti-Aliasing Fix ${{ steps.package.outputs.tag }}' `
            --notes-file build\release-notes.md
